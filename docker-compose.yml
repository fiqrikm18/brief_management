services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brief-manager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brief-manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./core/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/brief-manager
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "80:80"
    depends_on:
      - core
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
